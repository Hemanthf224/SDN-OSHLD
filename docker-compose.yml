version: '3.8'

services:
  api:
    build: .
    container_name: sdn_oshld_api
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  dashboard:
    build: .
    container_name: sdn_oshld_dashboard
    ports:
      - "5000:5000"
    command: ["python", "dashboard/app.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api
